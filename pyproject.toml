[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "candlecast"
version = "0.1.0"
description = "Desktop app for probabilistic price forecasts with the open-source Kronos model"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.0",
    "einops==0.8.1",
    "huggingface_hub==0.33.1",
    "safetensors==0.6.2",
    "numpy<2.1",
    "pandas==2.2.3",
    "pyarrow",
    "matplotlib==3.9.3",
    "tqdm",
    "alpaca-py",
    "yfinance",
    "exchange-calendars",
    "python-dotenv",
    "customtkinter>=5.2",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
candlecast = "candlecast.cli:main"

[project.gui-scripts]
candlecast-app = "candlecast.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:matplotlib.*", "ignore:.*deprecated - use.*"]
markers = [
    "slow: loads real Kronos weights from the Hugging Face cache (deselect with -m 'not slow')",
]
